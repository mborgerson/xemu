name: Build for macOS

on:
  workflow_call:
    inputs:
      pkg_version:
        description: Build version
        required: true
        type: string

jobs:
  build:
    name: Build for macOS (${{ matrix.arch }}, ${{ matrix.configuration }})
    runs-on: macos-15
    strategy:
      matrix:
        arch: [x86_64, arm64]
        configuration: [debug, release]
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      CCACHE_DIR: ${{ github.workspace }}/xemu-ccache
      CCACHE_MAXSIZE: 512M
      LTO_CACHE_DIR: ${{ github.workspace }}/xemu-lto-cache
    steps:
    - name: Download source package
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v4
      with:
        name: src
    - name: Extract source package
      run: tar -xf xemu-${{ inputs.pkg_version }}.tar.zst --strip-components=2
    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        brew install \
          ccache \
          coreutils \
          dylibbundler
        pip install pyyaml requests
    - name: Download and Install Vulkan SDK
      if: matrix.arch == 'arm64'
      env:
        VULKAN_SDK_VERSION: "1.4.341.0"
      run: |
        # Download the Vulkan SDK
        curl -L -o vulkansdk.zip \
          "https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VERSION}/mac/vulkansdk-macos-${VULKAN_SDK_VERSION}.zip"

        # Extract the SDK installer
        unzip -q vulkansdk.zip

        # Run the installer in unattended mode, including KosmicKrisp component
        sudo "./vulkansdk-macOS-${VULKAN_SDK_VERSION}.app/Contents/MacOS/vulkansdk-macOS-${VULKAN_SDK_VERSION}" \
          --root "${HOME}/VulkanSDK/${VULKAN_SDK_VERSION}" \
          --accept-licenses \
          --default-answer \
          --confirm-command install com.lunarg.vulkan.kosmic

        # Clean up
        rm -rf vulkansdk.zip "vulkansdk-macOS-${VULKAN_SDK_VERSION}.app"

        # Set environment variables for the build
        echo "VULKAN_SDK=${HOME}/VulkanSDK/${VULKAN_SDK_VERSION}/macOS" >> "$GITHUB_ENV"
    - name: Initialize compiler, library cache
      id: cache
      uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v4
      with:
        path: |
          macos-pkgs
          ${{ env.CCACHE_DIR }}
          ${{ env.LTO_CACHE_DIR }}
        key: cache-${{ runner.os }}-${{ matrix.arch }}-${{ matrix.configuration }}-${{ github.sha }}
        restore-keys: cache-${{ runner.os }}-${{ matrix.arch }}-${{ matrix.configuration }}-
    - name: Setup ccache
      run: |
        echo "PATH=/opt/homebrew/opt/ccache/libexec:$PATH" >> "$GITHUB_ENV"
        mkdir -p ${CCACHE_DIR}
        ccache -z
    - name: Setup build options
      run: |
        if [[ "${{ matrix.configuration }}" == "debug" ]]; then
          opts=(
            --debug
          )
        else
          opts=(
            -Db_lto=true
            -Db_lto_mode=thin
            -Db_thinlto_cache=true
            -Db_thinlto_cache_dir="$LTO_CACHE_DIR"
          )
          mkdir -p ${LTO_CACHE_DIR}
        fi
        echo "XEMU_BUILD_OPTIONS=${opts[*]}" >> "$GITHUB_ENV"
    - name: Compile
      run: ./build.sh -a ${{ matrix.arch }} ${XEMU_BUILD_OPTIONS}
    - name: Report ccache stats
      run: ccache -s
    - name: Package
      id: package
      env:
        VERSION: ${{ inputs.pkg_version }}${{ matrix.configuration == 'debug' && '-dbg' || '' }}
      run: |
        pkg_filename="xemu-${VERSION}-macos-${{ matrix.arch }}-unsigned.zip"
        echo "pkg_filename=${pkg_filename}" >> $GITHUB_OUTPUT

        pushd dist
        zip -r ../${pkg_filename} *
        popd
    - name: Upload build artifact
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4
      with:
        name: xemu-macos-${{ matrix.arch }}-${{ matrix.configuration }}
        path: ${{ steps.package.outputs.pkg_filename }}
        compression-level: 0

  build_universal:
    name: Build macOS Universal bundle (${{ matrix.configuration }})
    runs-on: macos-15
    needs: build
    strategy:
      matrix:
        configuration: [debug, release]
    steps:
    - name: Download architecture-specific builds
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v4
      with:
        pattern: "xemu-macos-*-${{ matrix.configuration }}"
        merge-multiple: true
    - name: Build Universal bundle
      run: |
        mkdir dist
        pushd dist

        # Extract x86_64 build first (base)
        unzip -o ../xemu-*-x86_64-unsigned.zip
        mv xemu.app/Contents/MacOS/xemu ../xemu_x86_64

        # Extract arm64 build (this will add Vulkan/KosmicKrisp libraries)
        unzip -o ../xemu-*-arm64-unsigned.zip
        mv xemu.app/Contents/MacOS/xemu ../xemu_arm64

        # Create universal binary
        lipo -create -output xemu.app/Contents/MacOS/xemu ../xemu_x86_64 ../xemu_arm64

        # Merge architecture-specific Libraries directories
        # The x86_64 libraries are in Libraries/x86_64, arm64 in Libraries/arm64
        # Both should be preserved for the universal build

        # Re-sign the universal binary and all bundled libraries
        codesign --force --deep --preserve-metadata=entitlements,requirements,flags,runtime --sign - xemu.app/Contents/MacOS/xemu

        # Sign Vulkan libraries if present (arm64 only)
        if [ -d "xemu.app/Contents/Frameworks" ]; then
          for lib in xemu.app/Contents/Frameworks/*.dylib; do
            if [ -f "$lib" ]; then
              codesign --force --preserve-metadata=entitlements,requirements,flags,runtime --sign - "$lib"
            fi
          done
        fi

        popd
    - name: Package
      id: package
      env:
        VERSION: ${{ inputs.pkg_version }}${{ matrix.configuration == 'debug' && '-dbg' || '' }}
      run: |
        pkg_filename="xemu-${VERSION}-macos-universal-unsigned.zip"
        echo "pkg_filename=${pkg_filename}" >> $GITHUB_OUTPUT
        pushd dist
        zip -r ../${pkg_filename} *
        popd
    - name: Upload build artifact
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4
      with:
        name: xemu-macos-universal-${{ matrix.configuration }}
        path: ${{ steps.package.outputs.pkg_filename }}
        compression-level: 0
